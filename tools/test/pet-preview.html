<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>桌寵預覽</title>
<!-- 本機看桌寵畫面用：不連資料庫，用假的資料。python3 -m http.server 後開 /tools/test/pet-preview.html
     ?mood=hungry|angry|sulky|asleep|happy|quiet  ?new=1（還沒領養）  ?stage=2
     ?stamps=0..6（護照章，3/6 解鎖）  ?pals=1（島上多一隻；?pals=11 十二隻全上島）  ?isle=1（直接開寵物島）  ?trav=1（自己的時空旅人站在島上）  ?eggs=N（等著孵的蛋） -->
<base href="../../">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/park.css">
</head>
<body>
<div id="world"><div id="sea"></div><div id="stage">
  <section class="scene" id="select"><div id="map" style="width:1600px"><div class="layer" style="--d:0" id="isles">
    <button class="isle" style="left:50px;top:330px;width:430px"><div class="bob"><div class="lift"><img class="art" src="img/l-01.webp" alt=""></div></div></button>
    <button class="isle pet-isle" id="pisle" style="left:130px;top:125px;width:240px"><div class="bob"><div class="lift"><img class="art" src="img/l-07.webp" alt=""></div></div><div class="plate"><b>寵物島</b><span>夥伴們住的地方</span></div></button>
  </div></div></section>
</div></div>
<div id="ui"><div id="petroom" hidden></div><div id="wardrobe" hidden></div></div>
<script type="module">
import * as pet from './js/pet.js';
import * as auth from './js/auth.js';
import * as traveller from './js/traveller.js';
const q = new URLSearchParams(location.search);
const mood = q.get('mood') ?? 'normal';
const now = Date.now();
const S = {
  pets: q.get('new') ? [] : [{ id: 1, species: q.get('sp') ?? 'puppy', name: '豆豆', active: true, xp: +(q.get('xp') ?? 7),
    stage: +(q.get('stage') ?? 1), next_xp: 12, mood: mood === 'sulky' || mood === 'quiet' ? (mood === 'sulky' ? 'angry' : 'normal') : mood,
    sulky: mood === 'sulky', fed_at: new Date(now - 3600e3).toISOString(),
    full: { hungry: 0, angry: 0, sulky: 5, asleep: 0 }[mood] ?? 4, hungry_in: { hungry: 0, angry: 0, asleep: 0 }[mood] ?? 1380,
    joy: { happy: 5, hungry: 1, angry: 0, asleep: 0, sulky: 0 }[mood] ?? 2 }].concat(q.get('pals') ? ['kitten', 'hamster', 'bear', 'magpie', 'deer', 'pangolin', 'leopard-cat', 'dragon', 'unicorn', 'leaf-butterfly', 'ant-princess']
      .slice(0, Math.max(1, +q.get('pals') || 1)).map((sp, i) => (
    { id: i + 2, species: sp, name: sp, active: false, xp: 3, stage: 1 + (i % 3), next_xp: 12, mood: 'island', sulky: false, full: 5, joy: 4 })) : []),
  slots: 1 + (+(q.get('stamps') ?? 0) >= 3) + (+(q.get('stamps') ?? 0) >= 6), stamps: +(q.get('stamps') ?? 0), unlock_at: [3, 6],
  inventory: { kibble: 3, 'magic-fruit': 1 },
  species: [{ code: 'puppy', name: '小狗', starter: true }, { code: 'kitten', name: '小貓', starter: true }, { code: 'hamster', name: '黃金鼠', starter: true }],
  items: [{ code: 'kibble', kind: 'food', name: '時光飼料', icon: '🥣', xp: 1 },
          { code: 'magic-fruit', kind: 'special', name: '異世界魔法果', icon: '🍎', xp: 5, facility: 'guardian', facility_name: '守護異世界' },
          { code: 'rice-ball', kind: 'special', name: '八堡圳米糰', icon: '🍙', xp: 5, facility: 'island_pioneer', facility_name: '穿越吧！島嶼開拓者' }],
  quiet: mood === 'quiet',
  granted: q.get('gift') ? [{ source: 'daily', item: 'kibble', qty: 3 }, { source: 'stamp', item: 'magic-fruit', qty: 1 }] : [],
};
function joy(p, n) { p.pts = Math.min(20, (p.pts ?? 4) + n); p.joy = Math.max(1, Math.ceil(p.pts / 4)); }
const clone = () => JSON.parse(JSON.stringify(S));
// C 期小遊戲（?farm=1：材料先給一些、橘子樹快熟了）
S.trees = q.get('farm') ? { orange: { grow: 2, watered: false } } : {};
if (q.get('farm')) Object.assign(S.inventory, { 'fruit-orange': 6, 'fish-s': 1, 'cook-honey': 1, 'cook-bait': 1, 'cook-fert': 1 });
const add = (k, n) => { S.inventory[k] = (S.inventory[k] ?? 0) + n; };
const T = (t) => (S.trees[t] ??= { grow: 0, watered: false });
const games = {
  fish: async (size) => { await new Promise((r) => setTimeout(r, 200)); const item = ['fish-s', 'fish-s', 'fish-m', 'fish-l'][size]; if (item) add(item, 1);
    return { ...clone(), did: 'fish', item, coins: size === 3 ? 2 : size === 2 ? 1 : 0 }; },
  water: async (t, fert) => { const x = T(t); if (x.watered) throw new Error('今天喝飽了，明天再來澆');
    if (fert) S.inventory['cook-fert'] -= 1; x.grow = Math.min(3, x.grow + 1 + (fert ? 1 : 0)); x.watered = true;
    return { ...clone(), did: 'water', tree: t, grow: x.grow, fert: !!fert }; },
  bait: async () => { if (!S.inventory['cook-bait']) throw new Error('沒有魚餌'); S.inventory['cook-bait'] -= 1; return { ...clone(), did: 'bait', bait: 5 }; },
  harvest: async (t) => { const x = T(t); if (x.grow < 3) throw new Error('還沒結果喔'); x.grow = 0; add('fruit-' + t, 3);
    return { ...clone(), did: 'harvest', reap: { fruit: 'fruit-' + t, n: 3, seeds: 0 } }; },
  bake: async (rec, good, deco, top) => { const need = { 'bake-orange': 'fruit-orange', 'bake-apple': 'fruit-apple', 'bake-mango': 'fruit-mango', 'bake-fish': 'fish-s' }[rec];
    if ((S.inventory[need] ?? 0) < 2) throw new Error('材料不夠'); S.inventory[need] -= 2;
    if (top) S.inventory[top] -= 1; const item = rec + (top ? '-gold' : deco ? '-deco' : ''); add(item, good ? 2 : 1); return { ...clone(), did: 'bake', item, n: good ? 2 : 1 }; },
};
// ?eggs=N：島上有 N 顆等著孵的蛋（可以拖）
if (q.get('eggs')) S.eggs = ['bear', 'magpie', 'deer', 'pangolin'].slice(0, +q.get('eggs')).map((sp, i) => ({ species: sp, source: i === 1 ? 'parent' : 'stamp', hatch_on: new Date(Date.now() + (8 + 24 * (i + 1)) * 3600e3).toISOString().slice(0, 10) }));
if (q.get('resting')) S.pets.filter((p) => !p.active).slice(0, +q.get('resting')).forEach((p) => { p.resting = true; });
const api = {
  ...games,
  me: async () => clone(),
  adopt: async (sp, name) => { const free = S.species.filter((s) => !S.pets.some((p) => p.species === s.code));
    const code = sp === 'random' ? free[free.length - 1].code : sp; const first = !S.pets.length;
    S.pets.push({ id: S.pets.length + 1, species: code, name: name || S.species.find((s) => s.code === code).name, active: first, xp: 0, stage: 1, next_xp: 12,
      mood: first ? 'normal' : 'island', sulky: false, fed_at: new Date().toISOString(), full: 5, hungry_in: 1440, joy: first ? 2 : 4 });
    return { ...clone(), adopted: code }; },
  swap: async (id) => { const cur = S.pets.find((p) => p.active);
    if (['hungry', 'angry', 'asleep'].includes(cur.mood)) throw new Error(`${cur.name}肚子餓了，不肯走，先餵牠吃東西`);
    S.pets.forEach((p) => { p.active = p.id === id; if (p.active) p.resting = false; p.mood = p.active ? 'normal' : 'island'; p.full = 5; p.joy = p.active ? 2 : 4; p.hungry_in = 1440; });
    return clone(); },
  // 休息屋：照顧中的不能進去（?resting=3：一開始就有 3 隻在休息屋）
  rest: async (id, on) => { const p = S.pets.find((x) => x.id === id); if (p.active && on) throw new Error(`${p.name}是照顧中的夥伴，要留在你身邊喔`);
    p.resting = !!on; return clone(); },
  // 跟資料庫一樣：一份飼料撐 6 小時（點心 10），摸摸 +2 心情點、願望 +4、丟球 +2（每 4 點一格，13 點以上開心）
  feed: async (code) => { const p = S.pets.find((x) => x.active); const was = p.mood; if (!S.inventory[code]) throw new Error('背包裡沒有了');
    if (code === 'kibble' && p.hungry_in > 1380) throw new Error('牠吃得飽飽的，等一下再餵');
    S.inventory[code]--; const xp = code === 'kibble' ? 1 : 5; p.xp += xp; p.sulky = was === 'angry';
    p.hungry_in = Math.min(1440, Math.max(0, p.hungry_in ?? 0) + (code === 'kibble' ? 360 : 600)); p.full = Math.ceil(p.hungry_in / 288);
    joy(p, 1); p.mood = p.sulky ? 'angry' : p.pts >= 13 ? 'happy' : 'normal';
    return { ...clone(), did: 'feed', was, xp }; },
  pat: async () => { const p = S.pets.find((x) => x.active); const was = p.mood; let tired = false;
    if (was === 'asleep') p.mood = 'hungry'; else if ((was === 'hungry' || was === 'angry') && !p.sulky) {} else {
      tired = Date.now() - (p.patted ?? 0) < 180000; if (!tired) joy(p, 2); p.patted = Date.now(); p.sulky = false; p.mood = p.pts >= 13 ? 'happy' : 'normal'; }
    return { ...clone(), did: 'pat', was, xp: 0, tired }; },
  play: async (kind) => { const p = S.pets.find((x) => x.active); joy(p, kind === 'wish' ? 4 : 2); p.mood = p.pts >= 13 ? 'happy' : 'normal';
    return { ...clone(), did: 'play', was: p.mood, xp: kind === 'wish' ? 1 : 0 }; },
  rename: async (n) => { S.pets.find((x) => x.active).name = n; return clone(); },
  bowl: async () => { if (!S.inventory.kibble) throw new Error('背包裡沒有時光飼料了'); if ((S.bowl ?? 0) >= 3) throw new Error('飼料盆滿了');
    S.inventory.kibble--; S.bowl = (S.bowl ?? 0) + 1; return clone(); },
  furniture: async () => (q.get('furn') === 'all' ? ['house-mushroom', 'house-tree', 'house-igloo'] : []),
};
// ?deco=1：寵物島裝扮、拜訪、今日精選用假的資料（js/isle.js 直接叫 auth.isle，這裡換掉）
if (q.get('deco')) {
  const I = { saved: q.get('deco') === '2', theme: q.get('theme') ?? 'spring', name: [3, 0, 3], layout: {}, stored: [],
    themes: ['spring', 'beach', 'autumn', 'stars'], love: [3, 1, 2, 0, 1, 0], featured: q.get('feat') === '1',
    inbox: q.get('inbox') ? [{ id: 'u0', has: true, nickname: '小維', kind: 2 }, { id: 'u1', has: true, nickname: '阿哲', kind: 0 }, { id: 'x', nickname: 'Mia', kind: 4 }] : [] };
  const isles = [['芸芸', 'beach', [11, 13, 3]], ['小樹', 'snow', [6, 3, 19]], ['Mia', 'autumn', [7, 4, 6]],
    ['阿哲', 'candy', [9, 12, 4]], ['小維', 'stars', [0, 5, 7]], ['豆豆', 'spring', [5, 3, 8]]].map(([nick, theme, name], i) => ({
    id: 'u' + i, nickname: nick, theme, name, placed: 7, love: [5 + i, 3, 8 - i, 1, 2, 4], pet: { species: ['puppy', 'kitten', 'hamster'][i % 3], stage: 1 + (i % 3) },
    layout: { bed: { x: .78, y: .72 }, slide: { x: .3, y: .7, f: i % 2 }, pool: { x: .26, y: .52 }, swing: { x: .46, y: .64 }, fountain: { x: .62, y: .8 }, tent: { x: .88, y: .62 }, flowers: { x: .4, y: .82 } },
    pets: [{ species: 'kitten', stage: 2, name: '咪咪' }, { species: 'puppy', stage: 1, name: '豆豆' }], mine: null }));
  Object.assign(auth.isle, {
    me: async () => JSON.parse(JSON.stringify(I)), seen: async () => {},
    fans: async () => ({ love: I.love, visitors: 5, recent: [['小維', 2, 0], ['阿哲', 0, 0], ['Mia', 4, 1], ['芸芸', 0, 3], ['小樹', 1, 3], ['小維', 0, 6], ['阿哲', 2, 40]]
      .map(([nickname, kind, d], i) => ({ id: i === 4 ? 'x' : 'u' + (i % 6), has: i !== 4, nickname, kind, at: new Date(Date.now() - d * 864e5).toISOString() })) }), save: async (t, n, l) => { window.__isle = l; Object.assign(I, { theme: t, name: n, layout: l, saved: true }); return { ok: true }; },
    featured: async () => isles, explore: async (seed) => isles.map((x, i) => isles[(i + seed) % 6]).map((x, i) => ({ ...x, nickname: x.nickname + '・' + (seed * 6 + i) })), mates: async () => isles.slice(0, 4),
    // 我們班的島（一頁 12 座、可以找）：假裝班上有 30 座＋一個還沒打開寵物島的「小新」
    matesPage: async (q, page) => {
      const all = Array.from({ length: 30 }, (_, i) => ({ ...isles[i % 6], id: isles[i % 6].id, nickname: isles[i % 6].nickname + (i >= 6 ? i : '') }));
      const hit = q ? [...all.filter((x) => x.nickname.toLowerCase().includes(q.toLowerCase())), ...('小新'.includes(q) ? [{ id: 'n0', nickname: '小新', none: true }] : [])] : all;
      return { total: hit.length, page, size: 12, rows: hit.slice(page * 12, page * 12 + 12) };
    },
    view: async (id) => ({ ...isles.find((x) => x.id === id) }),
    react: async (id, k) => { const v = isles.find((x) => x.id === id); v.love[k]++; v.mine = k; return { love: v.love, mine: k }; },
  });
}
const stage = document.getElementById('stage');
const ui = document.getElementById('ui');
const fit = () => { stage.style.setProperty('--s', Math.min(innerWidth / 1600, innerHeight / 900)); ui.style.setProperty('--vw', innerWidth); ui.style.setProperty('--vh', innerHeight); };
addEventListener('resize', fit); fit();
pet.init({ api, me: () => ({ kind: 'student', nickname: '測試' }), host: () => document.getElementById('isles'),
  island: () => ({ left: 130, top: 125, width: 240 }) });
document.getElementById('pisle').onclick = () => pet.openIsland();
await pet.load();
if (q.get('open')) pet.open();
if (q.get('trav')) {
  auth.traveller.me = async () => ({ created: true, starter_set: 'street', owned: [],
    look: { face: 'face-girl', hair: 'hair-pony', hat: 'hat-bucket', top: 'top-street', bottom: 'bottom-wide', hand: 'hand-camera', back: null } });
  traveller.init({ me: () => ({ kind: 'student', id: 'preview', nickname: '測試' }) });
  await traveller.load();
}
if (q.get('isle')) pet.open();
</script>
</body>
</html>
