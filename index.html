<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>時空冒險樂園</title>
<meta name="description" content="時空冒險樂園：浮在海上的冒險樂園，每座島都是一個遊戲。">
<link rel="icon" href="img/l-02.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/park.css">
<!-- 首屏的圖和程式一開始就抓，不用等程式一層層讀完才發現要用（島圖帶 crossorigin，跟島上的遮罩共用同一份，不會抓兩次） -->
<link rel="preload" as="image" href="img/sea.webp">
<link rel="preload" as="image" href="img/logo.webp">
<link rel="preload" as="image" href="img/l-01.webp" crossorigin="anonymous">
<link rel="preload" as="image" href="img/l-02.webp" crossorigin="anonymous">
<link rel="preload" as="image" href="img/l-03.webp" crossorigin="anonymous">
<link rel="modulepreload" href="js/park.js">
<link rel="modulepreload" href="js/account.js">
<link rel="modulepreload" href="js/auth.js">
<link rel="modulepreload" href="js/passport.js">
<link rel="modulepreload" href="js/pet.js">
<link rel="modulepreload" href="js/traveller.js">
<link rel="modulepreload" href="js/shop.js">
<link rel="modulepreload" href="js/audio.js">
<link rel="modulepreload" href="js/units.js">
<link rel="modulepreload" href="js/warm.js">
</head>
<body>
<div id="world">
  <div id="sea"></div>
  <div id="stage">

    <!-- 開場：固定構圖，只放代表性的島；島圖與名稱從 data/park.json 讀 -->
    <section class="scene" id="title" aria-label="開場畫面" hidden>
      <div class="layer boats" style="--d:10"></div>
      <div class="layer" style="--d:18">
        <button class="isle" data-zone="village" style="left:40px;top:372px;width:470px;--delay:-1s"></button>
        <button class="isle" data-zone="castle" style="left:595px;top:262px;width:410px;--delay:-3s"></button>
        <button class="isle" data-zone="taiwan" style="left:1085px;top:392px;width:480px;--delay:-2s"></button>
      </div>
      <div class="layer" style="--d:28">
        <img id="logo" src="img/logo.webp" alt="Time Adventure Park 時空冒險樂園">
        <button class="btn" id="start">Start Game</button>
      </div>
    </section>

    <!-- 島嶼地圖：島放在資料裡的 slot 上，沒用到的 slot 是雲霧 -->
    <section class="scene" id="select" aria-label="選擇冒險島嶼" hidden>
      <div id="map">
        <div class="layer" style="--d:10" id="decor"></div>
        <div class="layer boats" style="--d:10"></div>
        <div class="layer" style="--d:18" id="isles"></div>
      </div>
    </section>

    <div id="flash"></div>
  </div>
</div>
<!-- 介面層：按鈕、對話框、護照都放這裡，用真正的螢幕大小排版，不跟著上面的舞台縮放（手機上字才不會變很小） -->
<div id="ui">
  <div id="hud">
    <div class="topbar">
      <button class="back" id="back">← 回到開場</button>
      <div class="sign"><img src="img/ui/sign.webp" alt=""><div><small>時空冒險樂園</small><b>冒險地圖</b></div></div>
    </div>
    <button class="pan" id="pan-l" aria-label="往左看" hidden></button>
    <button class="pan" id="pan-r" aria-label="往右看更多島嶼" hidden></button>
    <!-- 底部功能列：「我的東西」都在這裡（島上只放去哪裡玩）。學生才有，沒登入整條藏起來 -->
    <nav id="dock" aria-label="我的東西">
      <button id="pass-btn" hidden aria-label="打開樂園護照"><img src="img/ui/passport.webp" alt=""><b>護照</b><i class="dot" hidden></i></button>
      <button id="task-btn" hidden aria-label="每日任務"><img src="img/ui/task.webp" alt=""><b>每日任務</b><i class="badge" hidden></i></button>
      <button id="rank-btn" hidden aria-label="班級排行"><img src="img/ui/rank.webp" alt=""><b>排行</b></button>
      <button id="shop-btn" hidden aria-label="打開時空商店"><img src="img/ui/shop.webp" alt=""><b>商店</b></button>
      <button id="wear-btn" hidden aria-label="我的時空旅人"><img src="img/ui/wear.webp" alt=""><b>我的旅人</b></button>
      <button id="pet-btn" hidden aria-label="我的桌寵"><img src="img/ui/pet.webp" alt=""><b>桌寵</b></button>
    </nav>
    <div id="tick">
      <div class="bubble" id="tick-say" role="status" aria-live="polite" hidden></div>
      <button id="tick-btn" aria-label="導覽員滴答，點一下聽下一個提示"><img id="tick-img" src="img/tick/wave.webp" alt=""></button>
    </div>
  </div>
  <!-- 左上角的齒輪：聲音、問題回報、登出收在這裡 -->
  <div id="gear">
  <button id="gear-btn" type="button" aria-label="設定" aria-expanded="false"><img src="img/ui/gear.webp" alt=""><i class="dot" hidden></i></button>
  <div id="gear-menu" hidden>
  <button id="snd-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w1" d="M16 9.5a3.5 3.5 0 0 1 0 5"/><path class="w2" d="M18.5 7a7 7 0 0 1 0 10"/><path class="mute" d="M16 9l6 6M22 9l-6 6"/></svg><b>聲音全開</b></button>
  <button id="fb-btn" type="button" data-pfb aria-label="問題回報">💬<b>問題回報</b><i class="dot" hidden></i></button>
  <button id="out-btn" type="button" hidden>🚪<b>登出</b></button>
  <button id="ver-btn" type="button" data-park-changelog aria-label="版號與更新說明">ℹ️<b data-park-version data-prefix="版本 ">版本</b></button>
  </div>
  </div>
  <!-- 右上角：名牌＋時光幣 -->
  <div id="top-right">
  <button id="me-chip" hidden aria-label="我的帳號"></button>
  <button id="coin-chip" type="button" hidden></button>
  </div>
  <div id="veil" hidden></div>
  <div id="acct" hidden></div>
  <div id="pass" hidden></div>
  <div id="shop" hidden></div>
  <div id="petroom" hidden></div>
  <div id="wardrobe" hidden></div>
  <div id="toast" role="status" hidden></div>
  <div class="env-tag" id="env-tag" data-park-changelog hidden><span data-park-version data-prefix="測試站 ">測試站</span></div>
</div>
<div id="loading"><img src="img/tick/boat.webp" alt="">樂園開門中…</div>
<script src="js/vendor/supabase.js"></script>
<script src="js/feedback.js"></script>
<script src="js/changelog.js"></script>
<script type="module" src="js/park.js"></script>
</body>
</html>
