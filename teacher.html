<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>老師後台｜時空冒險樂園</title>
<meta name="description" content="時空冒險樂園的老師、家長、管理員後台：開班、開放遊戲、看全班進度、重設學生密碼。">
<link rel="icon" href="img/admin/class.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/park-back.css">
<link rel="stylesheet" href="css/teacher.css">
</head>
<body>
<header class="bar">
  <a class="park-back" href="./#map"><img src="img/admin/park.webp" alt="">回樂園</a>
  <img class="home" src="img/logo.webp" alt="時空冒險樂園">
  <div class="title">老師後台</div>
  <span class="env" id="env" hidden>測試站</span>
  <button class="ver" type="button" data-park-changelog data-park-version title="更新說明">v</button>
  <span class="spacer"></span>
  <span class="who" id="who" hidden></span>
  <button class="ghost mailbox" id="mailbox" type="button" title="信箱：樂園寄來的消息" hidden><img src="img/admin/mail.webp" alt="">信箱<span class="dot" id="mail-dot" hidden></span></button>
  <div class="helpwrap"><button class="ghost help" id="help" type="button" title="說明、問題回報、功能建議" aria-haspopup="menu" aria-expanded="false" hidden><img src="img/admin/help.webp" alt="">？</button>
    <div class="helpmenu" id="helpmenu" role="menu" hidden>
      <button role="menuitem" data-help="tour"><img src="img/admin/help.webp" alt="">重看導覽</button>
      <button role="menuitem" data-help="guide"><img src="img/admin/passport.webp" alt="">使用指南</button>
      <button role="menuitem" data-help="feedback"><img src="img/admin/mail.webp" alt="">問題回報<span class="dot" id="fb-dot" hidden></span></button>
      <button role="menuitem" data-help="idea"><img src="img/admin/notify.webp" alt="">功能建議</button>
      <a role="menuitem" href="mailto:timepark@ciyulab.com?subject=%E6%99%82%E7%A9%BA%E5%86%92%E9%9A%AA%E6%A8%82%E5%9C%92%EF%BC%9A"><img src="img/admin/mail.webp" alt="">聯繫園長<small>timepark@ciyulab.com</small></a>
    </div></div>
  <button class="ghost" id="logout" hidden><img src="img/admin/logout.webp" alt="">登出</button>
</header>
<section class="hero" id="hero" hidden>
  <img id="avatar" src="img/admin/av-teacher.webp" alt="">
  <div><h1 id="hi"></h1><p id="role"></p></div>
</section>
<nav class="tabs" id="tabs" hidden>
  <button data-view="home" class="on">首頁</button>
  <button data-view="kids">孩子</button>
  <button data-view="quiz">測驗卷</button>
  <button data-view="settings">設定</button>
  <button data-view="admin" id="tab-admin" hidden>管理<span class="dot" id="adm-dot" hidden></span></button>
</nav>
<main id="view"><p class="loading"><img src="img/tick/boat.webp" alt="">後台開門中…</p></main>
<div id="toast" role="status" hidden></div>
<dialog id="dlg"></dialog>
<script src="js/vendor/supabase.js"></script>
<script src="js/changelog.js"></script>
<script type="module" src="js/teacher.js"></script>
</body>
</html>
